name: Deploy to Server

on:
  workflow_run:
    workflows: ["CI & Release Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (leave empty for latest)"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy Release to Server
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main' && vars.ENABLE_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout templates
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download release binary & verify SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OS: ${{ vars.DEPLOY_TARGET_OS || 'linux-x64' }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p deploy_pkg
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "${TAG}" ]; then
            echo "No release found to deploy" >&2
            exit 1
          fi
          echo "Deploying release tag: ${TAG}"
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "codex-proxy-${TARGET_OS}*" \
            --pattern "${TARGET_OS}.sha256" \
            --dir deploy_pkg
          (cd deploy_pkg && sha256sum -c "${TARGET_OS}.sha256" --ignore-missing)
          cp config.example.toml deploy_pkg/config.example.toml

      - name: Atomic SSH Deploy with Health Probe & Automatic Rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_JUMP_HOST: ${{ secrets.DEPLOY_JUMP_HOST }}
          DEPLOY_JUMP_USER: ${{ secrets.DEPLOY_JUMP_USER || 'root' }}
          DEPLOY_JUMP_PORT: ${{ secrets.DEPLOY_JUMP_PORT || '22' }}
          DEPLOY_JUMP_KEY: ${{ secrets.DEPLOY_JUMP_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/codex-proxy' }}
          DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'codex-proxy.service' }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8318/healthz' }}
          TARGET_OS: ${{ vars.DEPLOY_TARGET_OS || 'linux-x64' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          {
            echo "Host *"
            echo "  StrictHostKeyChecking no"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 6"
            echo "  TCPKeepAlive yes"
          } > ~/.ssh/config

          if [ -n "${DEPLOY_JUMP_HOST:-}" ]; then
            printf '%s\n' "$DEPLOY_JUMP_KEY" > ~/.ssh/jump_key
            chmod 600 ~/.ssh/jump_key

            {
              echo "Host jumphost"
              echo "  HostName ${DEPLOY_JUMP_HOST}"
              echo "  User ${DEPLOY_JUMP_USER}"
              echo "  Port ${DEPLOY_JUMP_PORT}"
              echo "  IdentityFile ~/.ssh/jump_key"
              echo ""
              echo "Host target"
              echo "  HostName ${DEPLOY_HOST}"
              echo "  User ${DEPLOY_USER}"
              echo "  Port ${DEPLOY_PORT}"
              echo "  IdentityFile ~/.ssh/deploy_key"
              echo "  ProxyJump jumphost"
            } >> ~/.ssh/config
          else
            {
              echo "Host target"
              echo "  HostName ${DEPLOY_HOST}"
              echo "  User ${DEPLOY_USER}"
              echo "  Port ${DEPLOY_PORT}"
              echo "  IdentityFile ~/.ssh/deploy_key"
            } >> ~/.ssh/config
          fi
          chmod 600 ~/.ssh/config

          ssh target "mkdir -p '${DEPLOY_DIR}'"

          scp -C \
            "deploy_pkg/codex-proxy-${TARGET_OS}" \
            "deploy_pkg/config.example.toml" \
            "target:${DEPLOY_DIR}/"

          ssh target bash -s -- "${DEPLOY_DIR}" "${TARGET_OS}" "${DEPLOY_SERVICE_NAME}" "${DEPLOY_HEALTH_URL}" << 'EOS'
            set -euo pipefail
            DEPLOY_DIR="$1"
            TARGET_OS="$2"
            DEPLOY_SERVICE_NAME="$3"
            DEPLOY_HEALTH_URL="$4"

            if [ "$(id -u)" -eq 0 ]; then
              SYSTEMCTL="systemctl"
            else
              SYSTEMCTL="sudo systemctl"
            fi

            cd "${DEPLOY_DIR}"
            mv "codex-proxy-${TARGET_OS}" codex-proxy.new
            chmod +x codex-proxy.new

            ${SYSTEMCTL} stop "${DEPLOY_SERVICE_NAME}" || true
            if [ -f codex-proxy ]; then
              cp -f codex-proxy codex-proxy.prev
            fi
            mv -f codex-proxy.new codex-proxy
            ln -sf "${DEPLOY_DIR}/codex-proxy" /usr/local/bin/codex-proxy
            ${SYSTEMCTL} start "${DEPLOY_SERVICE_NAME}"

            for i in $(seq 1 10); do
              if curl -fsS "${DEPLOY_HEALTH_URL}" >/dev/null 2>&1; then
                echo "Health check succeeded on attempt ${i}"
                exit 0
              fi
              sleep 2
            done

            echo "Health probe failed; rolling back to codex-proxy.prev" >&2
            ${SYSTEMCTL} stop "${DEPLOY_SERVICE_NAME}" || true
            if [ -f codex-proxy.prev ]; then
              mv -f codex-proxy.prev codex-proxy
              ${SYSTEMCTL} start "${DEPLOY_SERVICE_NAME}" || true
            fi
            journalctl -u "${DEPLOY_SERVICE_NAME}" -n 50 --no-pager || true
            exit 1
          EOS
