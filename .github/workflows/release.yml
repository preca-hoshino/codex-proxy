name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
            arch: x64
          - name: arm64
            target: aarch64-pc-windows-msvc
            arch: x64_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: matrix.name == 'x64'
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prepare binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codex-proxy.exe" "staging/codex-proxy-${{ matrix.name }}.exe"
          if ('${{ matrix.name }}' -eq 'x64') {
            Copy-Item 'staging/codex-proxy-x64.exe' 'staging/codex-proxy.exe'
          }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: staging/*.exe
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          tag="v${version}-b${GITHUB_RUN_NUMBER}-${COMMIT_SHA:0:6}"
          gh release create "$tag" \
            dist/codex-proxy.exe dist/codex-proxy-x64.exe dist/codex-proxy-arm64.exe \
            --target "$COMMIT_SHA" --title "$tag" --generate-notes
